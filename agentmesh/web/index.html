<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentMesh Chats</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">
<script src="marked.min.js"></script>
<style>
  /* Robouden Dark palette:
     bg:       #404040  editor
     sidebar:  #353535
     panel:    #505050
     deep:     #303030  peekView
     menu:     #272727
     fg:       #DEDEDE
     fg-dim:   #b0b0b0
     accent:   #e58520  list.highlight
     accent2:  #3655b5  badge/peekBorder
     yellow:   #FCEB6C  cursor/peek
     select:   #A0A0C0
  */

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #404040;
    color: #DEDEDE;
    min-height: 100vh;
  }

  header {
    background: #272727;
    padding: 18px 32px;
    border-bottom: 2px solid #e5852055;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  header h1 {
    font-size: 1.6rem;
    letter-spacing: 2px;
    color: #fff;
    text-transform: uppercase;
    font-weight: 700;
  }

  header .subtitle {
    font-size: 0.8rem;
    color: #b0b0b0;
    letter-spacing: 1px;
  }

  .tabs {
    display: flex;
    gap: 2px;
    padding: 0 32px;
    background: #272727;
    border-bottom: 2px solid #e5852055;
  }
  .tabs .tab {
    background: none;
    border: none;
    color: #b0b0b0;
    padding: 12px 20px;
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
  }
  .tabs .tab:hover { color: #DEDEDE; }
  .tabs .tab.active { color: #e58520; border-bottom-color: #e58520; }

  .controls {
    display: flex;
    gap: 12px;
    padding: 16px 32px;
    align-items: center;
    flex-wrap: wrap;
    background: #353535;
    border-bottom: 1px solid #ffffff15;
  }

  .controls input[type=text] {
    flex: 1;
    min-width: 260px;
    padding: 10px 16px;
    font-size: 1rem;
    background: #303030;
    border: 1px solid #505050;
    border-radius: 4px;
    color: #DEDEDE;
    outline: none;
    transition: border-color 0.2s;
  }
  .controls input[type=text]:focus { border-color: #e58520; }
  .controls input[type=text]::placeholder { color: #888; }

  .controls select {
    padding: 10px 14px;
    background: #303030;
    border: 1px solid #505050;
    border-radius: 4px;
    color: #DEDEDE;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .controls select:focus { border-color: #e58520; outline: none; }

  .stat {
    margin-left: auto;
    font-size: 0.85rem;
    color: #b0b0b0;
    white-space: nowrap;
  }
  .stat span { color: #e58520; font-weight: bold; }

  .table-wrap {
    padding: 24px 32px;
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
  }

  thead th {
    background: #303030;
    color: #FCEB6C;
    padding: 10px 12px;
    text-align: left;
    letter-spacing: 0.5px;
    border-bottom: 2px solid #e5852044;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  thead th:hover { background: #383838; }
  thead th.sort-asc::after  { content: ' ▲'; font-size: 0.7em; color: #e58520; }
  thead th.sort-desc::after { content: ' ▼'; font-size: 0.7em; color: #e58520; }

  tbody tr {
    border-bottom: 1px solid #ffffff10;
    transition: background 0.1s;
  }
  tbody tr:nth-child(even) { background: #3a3a3a; }
  tbody tr:hover { background: #4e4e4e; cursor: pointer; }

  td {
    padding: 9px 12px;
    vertical-align: top;
  }

  td.date   { white-space: nowrap; color: #b0b0b0; font-size: 0.82rem; width: 155px; min-width: 155px; }
  td.agent  { white-space: nowrap; width: 100px; min-width: 90px; }
  td.role   { white-space: nowrap; width: 80px; min-width: 70px; color: #a8a8a8; font-size: 0.8rem; }
  td.thread { white-space: nowrap; width: 150px; min-width: 80px; max-width: 150px; color: #b0b0b0; font-size: 0.82rem; overflow: hidden; text-overflow: ellipsis; }
  td.content { word-break: break-word; line-height: 1.5; color: #DEDEDE; }

  .agent-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.3px;
  }

  .pill {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 999px;
    background: #e5852022;
    color: #e58520;
    white-space: nowrap;
  }
  td.pactions button {
    font-size: 0.75rem;
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid #505050;
    background: #303030;
    color: #DEDEDE;
    cursor: pointer;
    margin-right: 4px;
  }
  td.pactions button:hover { border-color: #e58520; color: #e58520; }
  .pfield { margin-top: 10px; }
  .pfield label { display: block; font-size: 0.78rem; color: #b0b0b0; margin-bottom: 4px; }
  .pfield input {
    width: 100%; padding: 8px 10px; background: #303030; border: 1px solid #505050;
    border-radius: 4px; color: #DEDEDE; font-size: 0.9rem; outline: none;
  }
  .pfield input:focus { border-color: #e58520; }
  .pfield textarea {
    width: 100%; padding: 8px 10px; background: #303030; border: 1px solid #505050;
    border-radius: 4px; color: #DEDEDE; font-size: 0.9rem; outline: none;
    font-family: inherit; resize: vertical; min-height: 80px;
  }
  .pfield textarea:focus { border-color: #e58520; }

  .loading {
    text-align: center;
    padding: 40px;
    color: #888;
    font-size: 1.1rem;
  }

  .highlight { background: #e5852044; color: #FCEB6C; border-radius: 2px; }

  .modal-bg {
    display: none;
    position: fixed; inset: 0;
    background: #000000bb;
    z-index: 100;
    justify-content: center;
    align-items: flex-start;
    padding: 60px 20px;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: #303030;
    border: 1px solid #e5852055;
    border-radius: 4px;
    max-width: 860px;
    width: 100%;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .modal-header {
    padding: 20px 32px 12px;
    flex-shrink: 0;
    border-bottom: 1px solid #ffffff15;
  }
  .modal h3 { color: #FCEB6C; font-size: 1rem; }
  #modalContent {
    padding: 16px 32px 24px;
    overflow-y: auto;
    flex: 1;
  }
  .modal-body {
    line-height: 1.7;
    font-size: 0.9rem;
    color: #DEDEDE;
    word-break: break-word;
  }
  .modal-body p { margin: 0.5em 0; }
  .modal-body h1,.modal-body h2,.modal-body h3,.modal-body h4 {
    color: #FCEB6C; margin: 1em 0 0.4em;
  }
  .modal-body ul,.modal-body ol { padding-left: 1.5em; margin: 0.4em 0; }
  .modal-body li { margin: 0.2em 0; }
  .modal-body code {
    background: #1e1e1e; padding: 1px 5px; border-radius: 3px;
    font-family: 'Consolas','Courier New',monospace; font-size: 0.85em; color: #a0c878;
  }
  .modal-body pre {
    background: #1e1e1e; padding: 12px 16px; border-radius: 4px;
    overflow-x: auto; margin: 0.6em 0;
    font-family: 'Consolas','Courier New',monospace; font-size: 0.85rem;
    white-space: pre; color: #a0c878;
  }
  .modal-body pre code { background: none; padding: 0; }
  .modal-body blockquote {
    border-left: 3px solid #e58520; margin: 0.6em 0;
    padding: 4px 12px; color: #b0b0b0;
  }
  .modal-body a { color: #e58520; }
  .modal-body strong { color: #fff; }
  .modal-body hr { border: none; border-top: 1px solid #555; margin: 1em 0; }
  .modal .close {
    position: absolute; top: 14px; right: 18px;
    cursor: pointer; font-size: 1.4rem; color: #888; line-height: 1;
  }
  .modal .close:hover { color: #FCEB6C; }
</style>
</head>
<body>

<header>
  <div>
    <h1>AgentMesh</h1>
    <div class="subtitle">Shared agent conversation history &amp; people register</div>
  </div>
</header>

<div class="tabs">
  <button class="tab active" data-tab="chats">Chats</button>
  <button class="tab" data-tab="people">People</button>
  <button class="tab" data-tab="outreach">Outreach</button>
</div>

<div id="chatsPane">
<div class="controls">
  <input type="text" id="search" placeholder="Search chat content..." autocomplete="off" autofocus>
  <select id="agentFilter">
    <option value="all">All agents</option>
  </select>
  <div class="stat">Showing <span id="shown">0</span> of <span id="total">0</span> messages</div>
</div>

<div class="table-wrap">
  <table id="chatTable">
    <thead>
      <tr>
        <th class="sort-desc" data-col="date">Date</th>
        <th data-col="agent">Agent</th>
        <th data-col="role">Role</th>
        <th data-col="thread">Thread</th>
        <th data-col="content">Content</th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr><td colspan="5" class="loading">Loading...</td></tr>
    </tbody>
  </table>
</div>
</div>

<div id="peoplePane" style="display:none">
<div class="controls">
  <input type="text" id="peopleSearch" placeholder="Search name, org, contact..." autocomplete="off">
  <select id="categoryFilter">
    <option value="all">All categories</option>
  </select>
  <button id="addPersonBtn" style="margin-left:auto;padding:9px 16px;background:#e58520;color:#1c1c1c;border:none;border-radius:4px;font-weight:600;cursor:pointer;">+ Add person</button>
</div>
<div class="table-wrap">
  <table id="peopleTable">
    <thead>
      <tr>
        <th data-pcol="name">Name</th>
        <th data-pcol="category">Category</th>
        <th data-pcol="role">Role / Org</th>
        <th data-pcol="email">Contact</th>
        <th data-pcol="last_date">Last Activity</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="peopleTbody">
      <tr><td colspan="6" class="loading">Loading...</td></tr>
    </tbody>
  </table>
</div>
</div>

<div id="outreachPane" style="display:none">
<div class="controls">
  <input type="text" id="outreachSearch" placeholder="Search contact, subject, note..." autocomplete="off">
  <select id="outreachStatusFilter">
    <option value="all">All statuses</option>
  </select>
  <button id="addOutreachBtn" style="margin-left:auto;padding:9px 16px;background:#e58520;color:#1c1c1c;border:none;border-radius:4px;font-weight:600;cursor:pointer;">+ Add entry</button>
</div>
<div class="table-wrap">
  <table id="outreachTable">
    <thead>
      <tr>
        <th data-ocol="sent_date">Date</th>
        <th data-ocol="contact">Contact / Org</th>
        <th data-ocol="channel">Channel</th>
        <th data-ocol="subject">Subject</th>
        <th data-ocol="status">Status</th>
        <th data-ocol="due_date">Due</th>
        <th data-ocol="note">Notes</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="outreachTbody">
      <tr><td colspan="8" class="loading">Loading...</td></tr>
    </tbody>
  </table>
</div>
</div>

<div class="modal-bg" id="personModalBg">
  <div class="modal" id="personModal" style="max-width:520px;">
    <div class="modal-header">
      <span class="close" id="personModalClose">&times;</span>
      <h3 id="personModalTitle">Add person</h3>
    </div>
    <div id="personModalContent" class="modal-body" style="padding:16px 32px 24px;">
      <form id="personForm">
        <input type="hidden" id="p_id">
        <div class="pfield"><label>Name</label><input id="p_name" required></div>
        <div class="pfield"><label>Kanji</label><input id="p_kanji"></div>
        <div class="pfield"><label>Category</label><input id="p_category" required></div>
        <div class="pfield"><label>Role</label><input id="p_role"></div>
        <div class="pfield"><label>Org</label><input id="p_org"></div>
        <div class="pfield"><label>Phone</label><input id="p_phone"></div>
        <div class="pfield"><label>Email</label><input id="p_email"></div>
        <div class="pfield"><label>Website</label><input id="p_website"></div>
        <div class="pfield"><label>Last date (YYYY-MM-DD)</label><input id="p_last_date"></div>
        <div class="pfield"><label>Last note</label><input id="p_last_note"></div>
        <div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end;">
          <button type="button" id="deletePersonBtn" style="padding:9px 16px;background:transparent;color:#e07070;border:1px solid #e0707055;border-radius:4px;cursor:pointer;">Delete</button>
          <button type="button" id="personCancelBtn" style="padding:9px 16px;background:#404040;color:#DEDEDE;border:1px solid #505050;border-radius:4px;cursor:pointer;">Cancel</button>
          <button type="submit" style="padding:9px 16px;background:#e58520;color:#1c1c1c;border:none;border-radius:4px;font-weight:600;cursor:pointer;">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal-bg" id="outreachModalBg">
  <div class="modal" id="outreachModal" style="max-width:680px;">
    <div class="modal-header">
      <span class="close" id="outreachModalClose">&times;</span>
      <h3 id="outreachModalTitle">Add entry</h3>
    </div>
    <div class="modal-body" style="padding:16px 32px 24px;">
      <form id="outreachForm">
        <input type="hidden" id="o_id">
        <div class="pfield"><label>Date (YYYY-MM-DD)</label><input id="o_sent_date"></div>
        <div class="pfield"><label>Contact / Org</label><input id="o_contact" required></div>
        <div class="pfield"><label>Channel</label><input id="o_channel" placeholder="email / form / letter / phone"></div>
        <div class="pfield"><label>Subject</label><textarea id="o_subject" rows="2"></textarea></div>
        <div class="pfield"><label>Status</label><input id="o_status" placeholder="Sent / Drafted / Held / Verify"></div>
        <div class="pfield"><label>Due date (YYYY-MM-DD)</label><input id="o_due_date"></div>
        <div class="pfield"><label>Doc path</label><input id="o_doc_path" placeholder="docs/outreach/..."></div>
        <div class="pfield"><label>Notes</label><textarea id="o_note" rows="8"></textarea></div>
        <div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end;">
          <button type="button" id="deleteOutreachBtn" style="padding:9px 16px;background:transparent;color:#e07070;border:1px solid #e0707055;border-radius:4px;cursor:pointer;">Delete</button>
          <button type="button" id="outreachCancelBtn" style="padding:9px 16px;background:#404040;color:#DEDEDE;border:1px solid #505050;border-radius:4px;cursor:pointer;">Cancel</button>
          <button type="submit" style="padding:9px 16px;background:#e58520;color:#1c1c1c;border:none;border-radius:4px;font-weight:600;cursor:pointer;">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal">
    <div class="modal-header">
      <span class="close" id="modalClose">&times;</span>
      <h3 id="modalMeta"></h3>
    </div>
    <div id="modalContent" class="modal-body"></div>
  </div>
</div>

<script>
const AGENT_COLORS = {
  claude:          '#e58520',
  hermes:          '#FCEB6C',
  qwen:            '#a0c878',
  openclaw:        '#A0A0C0',
  opencode:        '#b0b0b0',
  'opencode-main': '#c8c8c8',
  'opencode-dev':  '#909090',
  kimi:            '#d4a0d4',
};
function agentColor(name) {
  return AGENT_COLORS[name] || '#555';
}

let currentSearch = '';
let currentAgent  = 'all';
let debounceTimer = null;
let allRows       = [];

async function fetchData() {
  const params = new URLSearchParams({
    q:      currentSearch,
    agent:  currentAgent,
    limit:  500,
    offset: 0,
  });
  const res  = await fetch('api.php?' + params);
  const data = await res.json();

  // Populate agent dropdown once
  const sel = document.getElementById('agentFilter');
  if (sel.options.length === 1) {
    data.agents.forEach(a => {
      const o = document.createElement('option');
      o.value = a; o.textContent = a;
      sel.appendChild(o);
    });
  }

  allRows = data.rows;
  document.getElementById('total').textContent = data.total;
  renderTable(data.rows);
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlight(text, q) {
  if (!q) return escapeHtml(text);
  const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return escapeHtml(text).replace(new RegExp('(' + escaped + ')', 'gi'),
    '<mark class="highlight">$1</mark>');
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'})
    + ' ' + d.toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit'});
}

let sortCol = 'date';
let sortAsc  = false;
const fullContent = {};

function renderTable(rows) {
  document.getElementById('shown').textContent = rows.length;
  const q    = currentSearch;
  const tbody = document.getElementById('tbody');

  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="loading">No results found.</td></tr>';
    return;
  }

  tbody.innerHTML = rows.map((r, i) => {
    fullContent[i] = r.content_preview || '';
    const preview = (r.content_preview || '').substring(0, 200);
    const badge   = `<span class="agent-badge" style="background:${agentColor(r.agent)}22;color:${agentColor(r.agent)};border:1px solid ${agentColor(r.agent)}55">${escapeHtml(r.agent)}</span>`;
    const thread  = r.thread_title ? escapeHtml(r.thread_title.substring(0,30)) : (r.thread_slug ? escapeHtml(r.thread_slug.substring(0,30)) : '—');
    return `<tr data-idx="${i}">
      <td class="date">${formatDate(r.created_at)}</td>
      <td class="agent">${badge}</td>
      <td class="role">${escapeHtml(r.role)}</td>
      <td class="thread" title="${r.thread_title||''}">${thread}</td>
      <td class="content">${highlight(preview, q)}${preview.length < (r.content_preview||'').length ? ' <span style="color:#555">…</span>' : ''}</td>
    </tr>`;
  }).join('');

  tbody.querySelectorAll('tr').forEach(tr => {
    tr.addEventListener('click', () => openModal(parseInt(tr.dataset.idx), rows));
  });
}

async function openModal(idx, rows) {
  const r = rows[idx];
  document.getElementById('modalMeta').textContent =
    `${r.agent}  ·  ${r.role}  ·  ${formatDate(r.created_at)}` +
    (r.thread_title ? `  ·  ${r.thread_title}` : '');
  document.getElementById('modalContent').innerHTML = '<em style="color:#888">Loading…</em>';
  document.getElementById('modalBg').classList.add('open');
  try {
    const res = await fetch('api.php?id=' + encodeURIComponent(r.id));
    const data = await res.json();
    const text = data.content || r.content_preview || '';
    document.getElementById('modalContent').innerHTML = marked.parse(text);
  } catch {
    document.getElementById('modalContent').innerHTML = marked.parse(r.content_preview || '');
  }
}

document.getElementById('modalClose').addEventListener('click', () =>
  document.getElementById('modalBg').classList.remove('open'));
document.getElementById('modalBg').addEventListener('click', e => {
  if (e.target === document.getElementById('modalBg'))
    document.getElementById('modalBg').classList.remove('open');
});

document.getElementById('search').addEventListener('input', e => {
  currentSearch = e.target.value.trim();
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(fetchData, 280);
});

document.getElementById('agentFilter').addEventListener('change', e => {
  currentAgent = e.target.value;
  fetchData();
});

// Column sort (client-side on loaded rows)
document.querySelectorAll('thead th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) { sortAsc = !sortAsc; }
    else { sortCol = col; sortAsc = col !== 'date'; }
    document.querySelectorAll('thead th').forEach(t => t.classList.remove('sort-asc','sort-desc'));
    th.classList.add(sortAsc ? 'sort-asc' : 'sort-desc');
    const sorted = [...allRows].sort((a, b) => {
      let va, vb;
      if (col === 'date')    { va = a.created_at; vb = b.created_at; }
      else if (col === 'agent')  { va = a.agent;      vb = b.agent; }
      else if (col === 'role')   { va = a.role;        vb = b.role; }
      else if (col === 'thread') { va = a.thread_title||''; vb = b.thread_title||''; }
      else                       { va = a.content_preview||''; vb = b.content_preview||''; }
      return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
    });
    renderTable(sorted);
  });
});

fetchData();

// ---- Tabs ----
document.querySelectorAll('.tabs .tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabs .tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('chatsPane').style.display  = tab === 'chats'  ? '' : 'none';
    document.getElementById('peoplePane').style.display  = tab === 'people' ? '' : 'none';
    document.getElementById('outreachPane').style.display  = tab === 'outreach' ? '' : 'none';
    if (tab === 'people' && !peopleLoaded) fetchPeople();
    if (tab === 'outreach' && !outreachLoaded) fetchOutreach();
  });
});

// ---- People tab ----
let peopleRows = [];
let peopleLoaded = false;
let peopleSearch = '';
let peopleCategory = 'all';
let peopleSortCol = 'category';
let peopleSortAsc = true;

async function fetchPeople() {
  const res = await fetch('people.php');
  const data = await res.json();
  peopleRows = data.rows || [];
  peopleLoaded = true;

  const sel = document.getElementById('categoryFilter');
  const cats = Array.from(new Set(peopleRows.map(p => p.category)));
  sel.innerHTML = '<option value="all">All categories</option>' +
    cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');

  renderPeople();
}

function renderPeople() {
  const q = peopleSearch.toLowerCase();
  let rows = peopleRows.filter(p =>
    (peopleCategory === 'all' || p.category === peopleCategory) &&
    (!q || [p.name,p.kanji,p.category,p.role,p.org,p.phone,p.email,p.last_note].join(' ').toLowerCase().includes(q))
  );
  rows.sort((a,b) => {
    const av = (a[peopleSortCol]||'').toString().toLowerCase();
    const bv = (b[peopleSortCol]||'').toString().toLowerCase();
    if (av < bv) return peopleSortAsc ? -1 : 1;
    if (av > bv) return peopleSortAsc ? 1 : -1;
    return 0;
  });

  const tbody = document.getElementById('peopleTbody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="loading">No results found.</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(p => `
    <tr>
      <td>${escapeHtml(p.name)}${p.kanji ? `<br><span style="color:#888;font-size:0.8em">${escapeHtml(p.kanji)}</span>` : ''}</td>
      <td><span class="pill">${escapeHtml(p.category)}</span></td>
      <td>${escapeHtml(p.role||'')}${p.org ? `<br><span style="color:#b0b0b0;font-size:0.85em">${escapeHtml(p.org)}</span>` : ''}</td>
      <td>${p.email ? `<a href="mailto:${p.email}" style="color:#e58520">${escapeHtml(p.email)}</a>` : (p.phone ? escapeHtml(p.phone) : '—')}${p.website ? `<br><a href="${p.website}" target="_blank" style="color:#e58520">${escapeHtml(p.website)}</a>` : ''}</td>
      <td style="color:#b0b0b0;font-size:0.85em">${p.last_date||''}<br>${escapeHtml(p.last_note||'')}</td>
      <td class="pactions"><button onclick="editPerson(${p.id})">Edit</button></td>
    </tr>
  `).join('');
}

document.getElementById('peopleSearch').addEventListener('input', e => {
  peopleSearch = e.target.value.trim();
  renderPeople();
});
document.getElementById('categoryFilter').addEventListener('change', e => {
  peopleCategory = e.target.value;
  renderPeople();
});
document.querySelectorAll('th[data-pcol]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.pcol;
    if (peopleSortCol === col) peopleSortAsc = !peopleSortAsc;
    else { peopleSortCol = col; peopleSortAsc = true; }
    renderPeople();
  });
});

const personForm = document.getElementById('personForm');
const personModalBg = document.getElementById('personModalBg');
const PERSON_FIELDS = ['name','kanji','category','role','org','phone','email','website','last_date','last_note'];

function openPersonDialog(p) {
  document.getElementById('personModalTitle').textContent = p ? 'Edit person' : 'Add person';
  document.getElementById('p_id').value = p ? p.id : '';
  PERSON_FIELDS.forEach(f => { document.getElementById('p_'+f).value = p ? (p[f]||'') : ''; });
  document.getElementById('deletePersonBtn').style.display = p ? '' : 'none';
  personModalBg.classList.add('open');
}

document.getElementById('addPersonBtn').addEventListener('click', () => openPersonDialog(null));
document.getElementById('personCancelBtn').addEventListener('click', () => personModalBg.classList.remove('open'));
document.getElementById('personModalClose').addEventListener('click', () => personModalBg.classList.remove('open'));
personModalBg.addEventListener('click', e => { if (e.target === personModalBg) personModalBg.classList.remove('open'); });

window.editPerson = (id) => openPersonDialog(peopleRows.find(p => p.id === id));

personForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const id = document.getElementById('p_id').value;
  const payload = {};
  PERSON_FIELDS.forEach(f => { payload[f] = document.getElementById('p_'+f).value; });
  if (id) {
    await fetch('people.php?id=' + id, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
  } else {
    await fetch('people.php', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
  }
  personModalBg.classList.remove('open');
  await fetchPeople();
});

document.getElementById('deletePersonBtn').addEventListener('click', async () => {
  const id = document.getElementById('p_id').value;
  if (!id || !confirm('Delete this person?')) return;
  await fetch('people.php?id=' + id, { method: 'DELETE' });
  personModalBg.classList.remove('open');
  await fetchPeople();
});

// ---- Outreach tab ----
function todayStr() { return new Date().toISOString().slice(0,10); }
let outreachRows = [];
let outreachLoaded = false;
let outreachSearch = '';
let outreachStatus = 'all';
let outreachSortCol = 'sent_date';
let outreachSortAsc = false;

async function fetchOutreach() {
  const res = await fetch('outreach.php');
  const data = await res.json();
  outreachRows = data.rows || [];
  outreachLoaded = true;

  const sel = document.getElementById('outreachStatusFilter');
  const statuses = Array.from(new Set(outreachRows.map(o => o.status).filter(Boolean)));
  sel.innerHTML = '<option value="all">All statuses</option>' +
    statuses.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');

  renderOutreach();
}

function renderOutreach() {
  const q = outreachSearch.toLowerCase();
  let rows = outreachRows.filter(o =>
    (outreachStatus === 'all' || o.status === outreachStatus) &&
    (!q || [o.contact,o.channel,o.subject,o.status,o.note,o.doc_path].join(' ').toLowerCase().includes(q))
  );
  rows.sort((a,b) => {
    const av = (a[outreachSortCol]||'').toString().toLowerCase();
    const bv = (b[outreachSortCol]||'').toString().toLowerCase();
    if (av < bv) return outreachSortAsc ? -1 : 1;
    if (av > bv) return outreachSortAsc ? 1 : -1;
    return 0;
  });

  const tbody = document.getElementById('outreachTbody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="8" class="loading">No results found.</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(o => `
    <tr>
      <td style="white-space:nowrap">${escapeHtml(o.sent_date||'')}</td>
      <td>${escapeHtml(o.contact||'')}</td>
      <td>${escapeHtml(o.channel||'')}</td>
      <td>${escapeHtml(o.subject||'')}</td>
      <td><span class="pill">${escapeHtml(o.status||'')}</span></td>
      <td style="white-space:nowrap;${o.due_date && o.due_date < todayStr() ? 'color:#e07070' : ''}">${escapeHtml(o.due_date||'')}</td>
      <td style="color:#b0b0b0;font-size:0.85em">${escapeHtml(o.note||'')}${o.doc_path ? `<br><span style="color:#888">${escapeHtml(o.doc_path)}</span>` : ''}</td>
      <td class="pactions"><button onclick="editOutreach(${o.id})">Edit</button></td>
    </tr>
  `).join('');
}

document.getElementById('outreachSearch').addEventListener('input', e => {
  outreachSearch = e.target.value.trim();
  renderOutreach();
});
document.getElementById('outreachStatusFilter').addEventListener('change', e => {
  outreachStatus = e.target.value;
  renderOutreach();
});
document.querySelectorAll('th[data-ocol]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.ocol;
    if (outreachSortCol === col) outreachSortAsc = !outreachSortAsc;
    else { outreachSortCol = col; outreachSortAsc = true; }
    renderOutreach();
  });
});
